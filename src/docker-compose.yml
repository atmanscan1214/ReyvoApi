services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: reyvo
      POSTGRES_USER: reyvo
      POSTGRES_PASSWORD: reyvo
    ports:
      - "5432:5432"
    volumes:
      - reyvo_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reyvo -d reyvo"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://reyvo:reyvo@db:5432/reyvo
      REDIS_URL: redis://redis:6379/0
      AUTO_CREATE_TABLES: "false"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head &&
             uvicorn reyvo.main:app --host 0.0.0.0 --port 8000"

  worker:
    build: .
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://reyvo:reyvo@db:5432/reyvo
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["python", "-m", "reyvo.workers.sender"]

volumes:
  reyvo_pgdata:
