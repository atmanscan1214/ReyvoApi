[project]
name = "reyvo-api"
version = "0.1.0"
description = "Backend API for Reyvo, a multi-tenant outbound growth platform for staffing agencies."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "Reyvo Product & Engineering" }]
dependencies = [
  "alembic>=1.14,<2",
  "aiosqlite>=0.20,<1",
  "cryptography>=44,<47",
  "email-validator>=2.2,<3",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "itsdangerous>=2.2,<3",
  "psycopg[binary]>=3.2,<4",
  "pwdlib[argon2]>=0.2,<1",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "PyJWT>=2.10,<3",
  "python-multipart>=0.0.20,<1",
  "sqlalchemy[asyncio]>=2.0.36,<3",
  "stripe>=11,<15",
  "uvicorn[standard]>=0.34,<1",
  "workos>=5,<6",
  "scalar-fastapi>=1.9.1",
  "semantic-kernel>=1.20,<2",
  "python-docx>=1.1,<2",
  "openai>=3,<4",
  "redis>=5,<7",
  "arq>=0.26,<1",
]

[dependency-groups]
dev = [
  "asgi-lifespan>=2.1,<3",
  "fakeredis[lua]>=2,<3",
  "pytest>=8.3,<10",
  "pytest-asyncio>=0.25,<1",
  "ruff>=0.8,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["reyvo"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests", "test"]
pythonpath = ["."]
filterwarnings = [
  "ignore::DeprecationWarning",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["reyvo", "tests", "test"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S"]
ignore = ["S101", "S105", "S107", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "S311"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
